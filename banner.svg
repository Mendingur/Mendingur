<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBF6EC"/>
    <stop offset="100%" stop-color="#F1E3C8"/>
  </linearGradient>
  <linearGradient id="wingGrad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#A8532A"/>
    <stop offset="55%" stop-color="#C99A3E"/>
    <stop offset="100%" stop-color="#E4C077"/>
  </linearGradient>
  <radialGradient id="coreGlow" cx="50%" cy="55%" r="55%">
    <stop offset="0%" stop-color="#FFF6DE" stop-opacity="0.95"/>
    <stop offset="55%" stop-color="#E4C077" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#E4C077" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="flowerGrad" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0%" stop-color="#A8532A"/>
    <stop offset="100%" stop-color="#E4C077"/>
  </linearGradient>
</defs>

<rect width="1200" height="280" fill="url(#bgGrad)"/>

<!-- emblem, left side -->
<g transform="translate(85,10) scale(0.58)">
  <circle cx="200" cy="215" r="145" fill="url(#coreGlow)"/>
  <path d="M200,338 C158,330 108,312 78,262 C52,218 50,160 78,108 C64,155 66,205 96,245 C118,274 148,296 178,308 C188,312 195,315 200,318 Z" fill="url(#wingGrad)"/>
  <path d="M200,338 C242,330 292,312 322,262 C348,218 350,160 322,108 C336,155 334,205 304,245 C282,274 252,296 222,308 C212,312 205,315 200,318 Z" fill="url(#wingGrad)"/>
  <path d="M200,340 L200,295" stroke="#8A4423" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <g transform="translate(200,278)">
    <g stroke="#FBF6EC" stroke-width="1.1" stroke-opacity="0.55">
      <ellipse rx="14" ry="21" transform="rotate(0)" fill="url(#flowerGrad)"/>
      <ellipse rx="14" ry="21" transform="rotate(72)" fill="url(#flowerGrad)"/>
      <ellipse rx="14" ry="21" transform="rotate(144)" fill="url(#flowerGrad)"/>
      <ellipse rx="14" ry="21" transform="rotate(216)" fill="url(#flowerGrad)"/>
      <ellipse rx="14" ry="21" transform="rotate(288)" fill="url(#flowerGrad)"/>
    </g>
    <circle r="9.5" fill="#FFF6DE"/>
    <circle r="3" fill="#E4A94E"/>
  </g>
  <g transform="translate(200,96)"><path d="M0,-24 C2,-7 7,-2 24,0 C7,2 2,7 0,24 C-2,7 -7,2 -24,0 C-7,-2 -2,-7 0,-24 Z" fill="#F3D488"/></g>
</g>

<!-- sparkles scattered right side -->
<g transform="translate(1100,60) scale(0.35)"><path d="M0,-24 C2,-7 7,-2 24,0 C7,2 2,7 0,24 C-2,7 -7,2 -24,0 C-7,-2 -2,-7 0,-24 Z" fill="#E4C077" opacity="0.7"/></g>
<g transform="translate(1150,180) scale(0.22)"><path d="M0,-24 C2,-7 7,-2 24,0 C7,2 2,7 0,24 C-2,7 -7,2 -24,0 C-7,-2 -2,-7 0,-24 Z" fill="#C99A3E" opacity="0.6"/></g>
<g transform="translate(1050,220) scale(0.16)"><path d="M0,-24 C2,-7 7,-2 24,0 C7,2 2,7 0,24 C-2,7 -7,2 -24,0 C-7,-2 -2,-7 0,-24 Z" fill="#C99A3E" opacity="0.5"/></g>

<!-- wordmark -->
<text x="330" y="145" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="64" fill="#2A2118">Mendingur</text>
<text x="332" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#8A6A3E" letter-spacing="0.5">Tác giả · Nhạc sĩ · Người kể chuyện</text>

<line x1="332" y1="205" x2="760" y2="205" stroke="#C99A3E" stroke-width="1" opacity="0.5"/>
